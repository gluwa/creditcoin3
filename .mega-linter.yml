---
DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - BASH_SHFMT
  - COPYPASTE_JSCPD
  - REPOSITORY_GRYPE
  # https://gluwa.atlassian.net/browse/CSUB-460
  - REPOSITORY_TRIVY
  - REPOSITORY_OSV_SCANNER
  # gitleaks is deprecated in MegaLinter (superseded by betterleaks, same author, kept enabled
  # below). The two read the same .gitleaks.toml, but deprecated gitleaks does not honor the
  # allowlisted well-known dev-key value-regexes that betterleaks does, so it re-flags the published
  # test keys in usc-messaging/.env.example. Rely on betterleaks for secret scanning.
  - REPOSITORY_GITLEAKS
  - RUST_CLIPPY
  - SPELL_CSPELL
  - SPELL_MISSPELL
  - GRAPHQL_GRAPHQL_SCHEMA_LINTER

GITHUB_COMMENT_REPORTER: false
JSON_PRETTIER_ARGUMENTS: --no-error-on-unmatched-pattern
# Git LFS pointer stubs (see .gitattributes) are not real JSON — jsonlint would fail on them.
# Raw chainspecs are huge anyway.
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: '(chainspecs/(dryRunSpec\.json|dryRunSpecRaw\.json|mainnetSpecRaw\.json))'
