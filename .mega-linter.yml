---
DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - BASH_SHFMT
  - COPYPASTE_JSCPD
  - REPOSITORY_GRYPE
  # https://gluwa.atlassian.net/browse/CSUB-460
  - REPOSITORY_TRIVY
  - REPOSITORY_OSV_SCANNER
  - RUST_CLIPPY
  - SPELL_CSPELL
  - GRAPHQL_GRAPHQL_SCHEMA_LINTER

GITHUB_COMMENT_REPORTER: false
JSON_PRETTIER_ARGUMENTS: --no-error-on-unmatched-pattern
# hadolint 2.15 added DL3066, which wants numeric UIDs in USER. Our images use the
# names their base images ship with (root, node, deno, creditcoin, postgresuser);
# hardcoding the UIDs behind those names would break whenever a base image renumbers them.
DOCKERFILE_HADOLINT_ARGUMENTS: --ignore DL3066
# trufflehog 3.96's Lob detector reports our Rust test function names (test_get_range_*,
# test_validate_genesis_*, ...) as verified Lob API keys. We do not use Lob.
REPOSITORY_TRUFFLEHOG_ARGUMENTS: --exclude-detectors=Lob
# Git LFS pointer stubs (see .gitattributes) are not real JSON — jsonlint would fail on them.
# Raw chainspecs are huge anyway.
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: '(chainspecs/(dryRunSpec\.json|dryRunSpecRaw\.json|mainnetSpecRaw\.json))'
