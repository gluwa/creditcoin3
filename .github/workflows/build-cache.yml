---
name: build-cache

# Keeps build-native.yml's reusable binaries current for the default branch. A PR into dev
# whose crates' sources match dev (it only changes CLI tests, docs or workflows) restores
# these instead of compiling the node again; see `reuse-binaries` in build-native.yml.
# A PR can only restore caches saved on its own ref or the default branch, so they have to
# be produced here, on every push that changes something a crate reads.
"on":
  push:
    branches: [dev]
    # Mirrors the files build-native.yml leaves out of the key: nothing to rebuild for them.
    paths:
      - "**"
      - "!cli/**"
      - "!cc3-indexer/**"
      - "!docs/**"
      - "!scripts/**"
      - "!.github/**"
      - "!.claude/**"
      - "!.cursor/**"
      - "!**.md"
      - ".github/workflows/build-native.yml"
      - ".github/install-protoc.sh"
      - ".github/workflows/build-cache.yml"
  workflow_dispatch:

concurrency:
  # Let a running build finish and save: cancelling it for every new dev push meant that on a
  # morning of merges nothing was saved at all (#1440's build was cancelled after 33 min).
  # GitHub keeps at most one run waiting and replaces it with each newer push, so after the
  # running build only the newest commit is built.
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

permissions: read-all

jobs:
  # Same inputs as ci.yml's build-creditcoin-node-for-testing-ci on PR runs, so the key
  # matches. The soaks there build at the release level and don't reuse binaries.
  build-testing-ci:
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=fast-runtime"
      workspace-opt-level: "1"
      git-lfs-checkout: false
      version-string: build-cache
      cache-key-name: build-creditcoin-node
      runs-on: "['ubuntu-26.04']"
      upload-artifacts: false
      reuse-binaries: true
    secrets: inherit
