---
name: BENCHMARKS

"on":
  pull_request:
    branches: [main, usc-testnet, usc-dev]
    paths:
      - "**weights.rs"
      - "**benchmarking.rs"
      - ".github/**bench**"
      - ".github/check-hardware.sh"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Break the self-trigger loop: exercise-benchmarks commits "Auto-update pallet weights", that
  # commit touches **weights.rs, which matches this workflow's own `paths` filter and re-triggers
  # it — and because weight measurement is timing, a re-run on a fresh runner ALWAYS produces a
  # diff, so the bot re-committed after its own commit indefinitely (pairs/strings of
  # "Auto-update pallet weights" commits on PRs, two Linode VMs + a full runtime-benchmarks build
  # per iteration). When the PR head commit IS the bot's own weights commit there is nothing left
  # to do: the weights were just regenerated and validated by the run that produced them.
  should-run:
    runs-on: ubuntu-26.04
    outputs:
      skip: ${{ steps.head.outputs.skip }}
    steps:
      - name: Check whether the head commit is the weights bot's own
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # workflow_dispatch has no PR head — always run.
          if [ -z "$HEAD_SHA" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          COMMIT_JSON=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA")
          AUTHOR=$(echo "$COMMIT_JSON" | jq -r '.commit.author.name')
          SUBJECT=$(echo "$COMMIT_JSON" | jq -r '.commit.message' | head -n1)
          if [ "$AUTHOR" = "gluwa-bot" ] && [ "$SUBJECT" = "Auto-update pallet weights" ]; then
              echo "INFO: head commit is the weights bot's own ($HEAD_SHA); skipping benchmarks"
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-runner-build-creditcoin-for-testing-benchmarks:
    needs:
      - should-run
    if: ${{ needs.should-run.outputs.skip != 'true' }}
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: "build-creditcoin-node-for-testing-benchmarks"
    secrets: inherit

  build-creditcoin-node-for-testing-benchmarks:
    needs:
      - deploy-runner-build-creditcoin-for-testing-benchmarks
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=runtime-benchmarks"
      git-lfs-checkout: false
      version-string: testing-benchmarks
      cache-key-name: build-creditcoin-node
      runs-on: "['self-hosted', 'workflow-${{ github.run_id }}', 'proxy-build-creditcoin-node-for-testing-benchmarks']"
    secrets: inherit

  rm-gh-runner-build-creditcoin-node-for-testing-benchmarks:
    needs:
      - should-run
      - build-creditcoin-node-for-testing-benchmarks
    # always() so a failed build still gets its runner removed — but not when the whole
    # workflow was skipped as the bot's own commit (no VM was ever deployed).
    if: ${{ always() && needs.should-run.outputs.skip != 'true' }}
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: "build-creditcoin-node-for-testing-benchmarks"
    secrets: inherit

  deploy-runner-benchmark:
    needs:
      - build-creditcoin-node-for-testing-benchmarks
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: "benchmark"
    secrets: inherit

  exercise-benchmarks:
    needs:
      - build-creditcoin-node-for-testing-benchmarks
      - deploy-runner-benchmark
    runs-on: [self-hosted, "workflow-${{ github.run_id }}", "proxy-benchmark"]
    # checkov:skip=CKV2_GHA_1:We need this for weights auto-update
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Inspect benchmark CI config
        run: |
          # WARNING: Command below may differ depending on which workflow config file
          # your job is defined in !!! Don't copy&paste it blindly !!!
          PALLETS_IN_CI_CONFIG=$(grep " .github/bench.sh -p" .github/workflows/benchmarks.yml | grep -v PALLETS_IN_CI_CONFIG | tr -s ' ' | cut -d' ' -f4 | sort | xargs)

          PALLETS_IN_SOURCE=$(.github/check-parity-bw-extrinsics-benchmarks-weights.sh --show-pallets)
          if [ "$PALLETS_IN_CI_CONFIG" != "$PALLETS_IN_SOURCE" ]; then
              echo "FAIL: Pallet mismatch between source code and benchmark CI config"
              echo "INFO: in source: '$PALLETS_IN_SOURCE'"
              echo "INFO: CI config: '$PALLETS_IN_CI_CONFIG'"
              exit 1
          fi

      - name: Set-Up
        run: |
          sudo apt-get update
          sudo apt install -y curl

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32-unknown-unknown
          components: rust-src

      # use cache from previous build jobs
      # WARNING: always before actions/download-artifact
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-creditcoin-node

      # WARNING: always after Swatinem/rust-cache
      - name: Download creditcoin-node binary
        uses: actions/download-artifact@v8
        with:
          name: binary-for-testing-benchmarks
          path: target/release

      - name: Check if runner machine meets chain's requirements
        continue-on-error: true
        run: |
          chmod a+x ./target/release/creditcoin3-node
          .github/check-hardware.sh

      - name: Run benchmarks to generate weights
        run: |
          .github/bench.sh -p attestation -b -s 2 -r 2
          .github/bench.sh -p randomness -b
          .github/bench.sh -p supported_chains -b

      - name: git diff
        run: |
          sudo apt-get install colordiff
          git diff | colordiff

      # check if automatically generated weights compile
      - name: Rebuild SUT with newly generated weights
        uses: gluwa/cargo@dev
        with:
          command: build
          args: --release

      - name: Commit changes to current branch
        if: github.base_ref == 'usc-dev'
        uses: EndBug/add-and-commit@v10
        with:
          author_name: gluwa-bot
          author_email: creditcoin@gluwa.com
          message: "Auto-update pallet weights"

  rm-gh-runner-benchmark:
    needs:
      - should-run
      - exercise-benchmarks
    # See rm-gh-runner-build-...: cleanup must survive a failed run, not a skipped one.
    if: ${{ always() && needs.should-run.outputs.skip != 'true' }}
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: "benchmark"
    secrets: inherit
