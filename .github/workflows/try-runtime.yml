---
name: Try Runtime

"on":
  pull_request:
    paths:
      - "**/migrations/**"
      - "**/migrations.rs"
      - "runtime/src/lib.rs"
      - ".github/workflows/try-runtime.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"

jobs:
  try-runtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-creditcoin-node

      - name: Bump version to force try-runtime to attempt to apply migrations
        id: bump-version
        run: |
          .github/bump-version.sh

          git status
          git diff

      - name: Build runtime with try-runtime
        run: |
          cargo build --release -p creditcoin3-runtime --features try-runtime

      - name: Install try-runtime-cli
        run: |
          cargo install --git https://github.com/paritytech/try-runtime-cli --locked

      - name: Run try-runtime on-runtime-upgrade
        timeout-minutes: 30
        run: |
          try-runtime \
            --runtime ./target/release/wbuild/creditcoin3-runtime/creditcoin3_runtime.wasm \
            on-runtime-upgrade \
            --blocktime 15000 \
            live --uri wss://rpc.cc3-devnet.creditcoin.network
