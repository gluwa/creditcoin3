---
name: typescript-checks

# Controls when the action will run.
"on":
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.cjs'
      - '**.json'
      - '**.css'
      - '**package.json'
      - '**package-lock.json'
      - '**yarn.lock'
      - '**deno.json'
      - '**deno.lock'
      # controls the version of deno we test with
      - 'scripts/stress-test/Dockerfile'
      - 'scripts/usc-audit-automation/Dockerfile'
      - '.github/workflows/typescript-checks.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  execute-command:
    name: ${{ matrix.command }} / ${{ matrix.directory }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        directory:
          # note: add also in .github/hooks/pre-commit
          [cc3-indexer, cli, docs/smart-contract-development/with-hardhat, scripts, scripts/changelog-warnings, checkpoint-verifier, usc-bridge-dapp]
        command: [lint, typecheck, check-format]
        include:
          - directory: cc3-indexer
            command: test:outbox-authorization
          # `yarn build` is the cheapest real correctness check for a Next.js app pre-merge — not
          # added to the shared `command` list above since not every directory in this matrix has
          # a build script.
          - directory: usc-bridge-dapp
            command: build

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g yarn

      - name: Install Solidity compiler
        run: |
          sudo .github/install-solidity-compiler.sh

      - name: Generate precompiles ABI from source code
        working-directory: ./precompiles/metadata
        run: |
          solc --version
          ./abi-creator.sh

      - name: Run tools
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f yarn.lock ]; then
              yarn install
          else
              npm clean-install
          fi
          yarn ${{ matrix.command }}

  deno-checks:
    name: ${{ matrix.command }} / ${{ matrix.directory }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        directory: [scripts/stress-test, scripts/usc-audit-automation]
        command: [lint, check, fmt-check]

    steps:
      - uses: actions/checkout@v7

      - name: Extract Deno version from Dockerfile
        id: deno_version
        working-directory: ${{ matrix.directory }}
        run: |
          # Extract version from "FROM denoland/deno:X.Y.Z" line
          VERSION=$(grep "^FROM denoland/deno:" Dockerfile | sed 's/.*denoland\/deno://' | sed 's/@sha256:.*//' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract Deno version from Dockerfile"
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted Deno version: v${VERSION}"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno_version.outputs.version }}

      - name: Run deno task ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}
        run: deno task ${{ matrix.command }}
