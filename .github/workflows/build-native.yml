# checkov:skip=CKV2_GHA_1:Caller is responsible for permissions
---
name: Reusable workflow to build a native client

"on":
  workflow_call:
    inputs:
      build-options:
        required: true
        type: string
      version-string:
        required: true
        type: string
      git-lfs-checkout:
        required: true
        type: boolean
      cache-key-name:
        required: false
        type: string
      runs-on:
        required: true
        type: string
      build-subxt:
        required: false
        type: boolean
      # Lets a caller run this purely to populate the Rust dependency cache, without
      # leaving ~200 MB of binaries behind that nothing downloads. Defaults to true so
      # every existing caller is unaffected.
      upload-artifacts:
        required: false
        type: boolean
        default: true
      # Reuse the binaries of an identical source tree instead of compiling them again, e.g. on
      # a PR that only changes CLI tests, docs or workflows. Entries are saved from the
      # default branch only (build-cache.yml keeps them current), keyed by every tracked file
      # a crate can read plus the build options. Off by default.
      reuse-binaries:
        required: false
        type: boolean
        default: false

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"
  NATIVE_BINARIES: |
    target/release/archiver
    target/release/attestor
    target/release/attestor_zombienet
    target/release/checkpoint-builder
    target/release/creditcoin3-node
    target/release/proof-gen-api-server
    target/release/query-cli
  # The binaries plus the runtime WASM: everything a reused build has to hand on.
  NATIVE_OUTPUTS: |
    target/release/archiver
    target/release/attestor
    target/release/attestor_zombienet
    target/release/checkpoint-builder
    target/release/creditcoin3-node
    target/release/proof-gen-api-server
    target/release/query-cli
    target/release/wbuild/creditcoin3-runtime/creditcoin3_runtime.compact.compressed.wasm

jobs:
  build-creditcoin-node:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # A cold build on a hosted runner is the slow case; well above it, far below the 6 h default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.git-lfs-checkout }}

      - name: Key the binaries by the files they're built from
        id: bin-key
        if: ${{ inputs.reuse-binaries }}
        env:
          BUILD_OPTIONS: ${{ inputs.build-options }}
        run: |
          set -euo pipefail
          # Blob ids of every tracked file except those no crate reads: the CLI and indexer
          # (TypeScript), docs, scripts, workflows and Markdown. Crates also read
          # chainspecs/ and common/cc-client/artifacts/ through include_bytes!, which stay in.
          SOURCES=$(git ls-files -s -- . ':!cli' ':!cc3-indexer' ':!docs' ':!scripts' \
            ':!.github' ':!.claude' ':!.cursor' ':!*.md' | sha256sum | cut -c1-40)
          # This workflow sets the build environment (CXXFLAGS, toolchain setup).
          SELF=$(git ls-files -s -- .github/workflows/build-native.yml | sha256sum | cut -c1-12)
          OPTS=$(printf '%s' "$BUILD_OPTIONS" | sha256sum | cut -c1-12)
          echo "key=native-bins-v1-${RUNNER_OS}-${RUNNER_ARCH}-${OPTS}-${SELF}-${SOURCES}" >> "$GITHUB_OUTPUT"

      - name: Restore binaries built from the same sources
        id: bin-cache
        if: ${{ steps.bin-key.outputs.key != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NATIVE_OUTPUTS }}
          key: ${{ steps.bin-key.outputs.key }}

      - name: Install protobuf
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
          components: rust-src

      # Hosted and self-hosted runners differ in Cargo home and checkout root, and `target/`
      # fingerprints record absolute paths, so an archive restored across families rebuilds
      # anyway. Give each family its own namespace so cache-warm.yml's hosted and Linode
      # warmers don't overwrite each other's entry.
      - name: Identify runner family
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        id: runner-family
        env:
          RUNNER_FAMILY: ${{ runner.environment }}
        run: |
          ID=$(printf '%s\n' "${RUNNER_FAMILY:-unknown}" "$HOME" | sha256sum | cut -c1-8)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # Swatinem/rust-cache keys on every installed toolchain, so the runner image's own
      # stable, which changes whenever GitHub updates the image, would rotate the key.
      - name: Remove the runner image's Rust toolchains
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        run: rustup toolchain list | cut -d' ' -f1 | grep -v "^${RUSTC_VERSION:?}-" | xargs -r -n1 rustup toolchain uninstall

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        with:
          # The default keeps callers that omit `cache-key-name` (proof-gen-api-server) in the
          # same namespace as the warmer, since they build the same configuration.
          shared-key: ${{ inputs.cache-key-name || 'build-creditcoin-node' }}-${{ steps.runner-family.outputs.id }}
          # Only the default branch saves; cache-warm.yml produces every key used here. An
          # entry saved under a PR or tag ref is readable by that ref alone, so it bought a
          # re-run at most, while the ~2 GB per ref pushed the repository past its 50 GB cache
          # limit and evicted the default-branch entries everyone restores from.
          save-if: ${{ github.event_name != 'pull_request' && github.ref_type != 'tag' }}

      - name: Start resource monitor
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        run: |
          .github/resource-monitor.sh start build-native

      - name: Build SUT
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' }}
        uses: gluwa/cargo@dev
        with:
          command: build
          args: ${{ inputs.build-options }}

      - name: Save the binaries for identical source trees
        if: ${{ inputs.reuse-binaries && steps.bin-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref_type != 'tag' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NATIVE_OUTPUTS }}
          key: ${{ steps.bin-key.outputs.key }}

      - name: Upload binaries
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-for-${{ inputs.version-string }}
          path: ${{ env.NATIVE_BINARIES }}

      - name: Upload WASM runtime
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: creditcoin_node_runtime.compact.compressed.wasm-${{ inputs.version-string }}
          path: target/release/wbuild/creditcoin3-runtime/creditcoin3_runtime.compact.compressed.wasm

      # subxt-cli is pinned below, so its binary only changes when the pin or the toolchain
      # does. Restore it instead of compiling it again on every release.
      - name: Restore subxt binary
        id: subxt-cache
        if: ${{ inputs.build-subxt }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/subxt
          key: subxt-cli-0.44.3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTC_VERSION }}

      - name: Install subxt
        if: ${{ inputs.build-subxt && steps.subxt-cache.outputs.cache-hit != 'true' }}
        uses: gluwa/cargo@dev
        with:
          command: install
          # keep in step with the `subxt` library pin in the root Cargo.toml:
          # the CLI writes common/cc-client/artifacts/metadata.scale and the
          # library's #[subxt::subxt(...)] macro has to parse it
          args: subxt-cli@0.44.3 --locked

      - name: Upload subxt binary
        if: ${{ inputs.build-subxt && inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: subxt
          path: ~/.cargo/bin/subxt

      - name: Report resource usage
        # Last step on purpose: Install subxt is a full cargo
        # compile on the release path when its cache misses, and would otherwise
        # land outside the sampling window.
        if: always() && steps.bin-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          .github/resource-monitor.sh report build-native
