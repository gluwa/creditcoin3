# checkov:skip=CKV2_GHA_1:Caller is responsible for permissions
---
name: Reusable workflow to build a native client

"on":
  workflow_call:
    inputs:
      build-options:
        required: true
        type: string
      version-string:
        required: true
        type: string
      git-lfs-checkout:
        required: true
        type: boolean
      warm-cache-only:
        description: Populate dependencies without publishing binaries; skip compilation on an exact cache hit.
        required: false
        type: boolean
        default: false
      cache-key-name:
        required: false
        type: string
      runs-on:
        required: true
        type: string
      build-subkey:
        required: false
        type: boolean
      build-subxt:
        required: false
        type: boolean
      use-new-metadata:
        required: false
        type: boolean

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"

jobs:
  build-creditcoin-node:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.warm-cache-only && 120 || 360 }}
    steps:
      - name: Checkout code regularly
        if: ${{ ! inputs.use-new-metadata }}
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.git-lfs-checkout }}

      - name: Checkout code for typedefs update
        if: ${{ inputs.use-new-metadata }}
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.git-lfs-checkout }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
          components: rust-src

      # Cache only interchangeable configurations together. The action adds the
      # toolchain, runner environment and dependency hashes. Do not remove those:
      # hosted and Linode runners have different Cargo paths and installed tools.
      - name: Identify native build configuration
        id: cache-config
        env:
          BUILD_OPTIONS: ${{ inputs.build-options }}
          LFS_CHECKOUT: ${{ inputs.git-lfs-checkout }}
          NEW_METADATA: ${{ inputs.use-new-metadata }}
        run: |
          VARIANT=$(printf '%s\n' "$BUILD_OPTIONS" "$LFS_CHECKOUT" "$NEW_METADATA" | sha256sum | cut -c1-16)
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: native-${{ inputs.cache-key-name || 'build-creditcoin-node' }}-${{ steps.cache-config.outputs.variant }}

      - name: Download new_metadata.diff
        if: ${{ inputs.use-new-metadata }}
        uses: actions/download-artifact@v8
        with:
          name: new-metadata.diff
          path: /var/tmp

      - name: Apply new metadata patch
        if: ${{ inputs.use-new-metadata }}
        run: |
          git apply /var/tmp/new-metadata.diff
          git diff --binary

      - name: Build SUT
        if: ${{ ! inputs.warm-cache-only || steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: gluwa/cargo@dev
        with:
          command: build
          args: ${{ inputs.build-options }}

      - name: Upload binaries
        if: ${{ ! inputs.warm-cache-only }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-for-${{ inputs.version-string }}
          path: |
            target/release/archiver
            target/release/attestor
            target/release/attestor_zombienet
            target/release/checkpoint-builder
            target/release/creditcoin3-node
            target/release/proof-gen-api-server
            target/release/query-cli

      - name: Upload WASM runtime
        if: ${{ ! inputs.warm-cache-only }}
        uses: actions/upload-artifact@v7
        with:
          name: creditcoin_node_runtime.compact.compressed.wasm-${{ inputs.version-string }}
          path: target/release/wbuild/creditcoin3-runtime/creditcoin3_runtime.compact.compressed.wasm

      - name: Summarize native cache reuse
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_VARIANT: ${{ steps.cache-config.outputs.variant }}
          WARM_ONLY: ${{ inputs.warm-cache-only }}
        run: |
          {
            echo "### Native dependency cache"
            echo "- Configuration: $CACHE_VARIANT"
            echo "- Exact cache hit: $CACHE_HIT"
            echo "- Cache warming only: $WARM_ONLY"
            echo "Regular builds always compile and validate the current checkout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install subkey
        if: ${{ inputs.build-subkey }}
        uses: gluwa/cargo@dev
        with:
          command: install
          args: --locked --git https://github.com/paritytech/polkadot-sdk --rev 7304295 subkey

      - name: Upload subkey binary
        if: ${{ inputs.build-subkey }}
        uses: actions/upload-artifact@v7
        with:
          name: subkey
          path: ~/.cargo/bin/subkey

      - name: Install subxt
        if: ${{ inputs.build-subxt }}
        uses: gluwa/cargo@dev
        with:
          command: install
          # keep in step with the `subxt` library pin in the root Cargo.toml:
          # the CLI writes common/cc-client/artifacts/metadata.scale and the
          # library's #[subxt::subxt(...)] macro has to parse it
          args: subxt-cli@0.44.3 --locked

      - name: Upload subxt binary
        if: ${{ inputs.build-subxt }}
        uses: actions/upload-artifact@v7
        with:
          name: subxt
          path: ~/.cargo/bin/subxt

      - name: Commit typedefs and metadata changes after successfull build
        if: ${{ inputs.use-new-metadata }}
        uses: EndBug/add-and-commit@v10
        with:
          add: "cli/creditcoin.json cli/src/lib/interfaces/ common/cc-client/artifacts/metadata.scale"
          author_name: gluwa-bot
          author_email: creditcoin@gluwa.com
          message: "Auto-update metadata & TypeScript type definitions"
          github_token: ${{ secrets.GLUWA_BOT_TOKEN }}
