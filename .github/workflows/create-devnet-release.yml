---
name: Create Devnet release

"on":
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      NETWORK:
        required: true
        type: choice
        options:
          - devnet
          - asc-devnet
        default: devnet
        description: "Network to release for. Dispatch from that network's branch."

permissions: read-all

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    # checkov:skip=CKV2_GHA_1:We need this for auto-commit
    permissions: write-all
    steps:
      # Fail before anything is committed: release.yml rejects a tag that is not on the
      # branch its suffix names, but by then the version bump would already be pushed.
      - name: Check the network matches the dispatched branch
        env:
          NETWORK: ${{ inputs.NETWORK }}
        run: |
          case "$NETWORK:$GITHUB_REF_NAME" in
              devnet:usc-dev|devnet:dev) ;;
              asc-devnet:writeability-off-usc-dev|asc-devnet:asc-dev) ;;
              *)
                  echo "FAIL: cannot release '$NETWORK' from branch '$GITHUB_REF_NAME'"
                  echo "      devnet is released from dev, asc-devnet from asc-dev"
                  exit 1
                  ;;
          esac

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLUWA_BOT_TOKEN }}

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: rustfmt

      - name: Bump version
        id: bump-version
        run: |
          .github/bump-version.sh

          git status
          git diff

      - name: Commit, tag & push changes to ${{ github.ref_name }}
        uses: EndBug/add-and-commit@v10
        with:
          push: true
          add: "Cargo.toml Cargo.lock runtime/src/version.rs"
          author_name: gluwa-bot
          author_email: creditcoin@gluwa.com
          message: "Bump version to ${{ steps.bump-version.outputs.new_version }}"
          tag: "${{ steps.bump-version.outputs.new_version }}-${{ inputs.NETWORK }}"
          github_token: ${{ secrets.GLUWA_BOT_TOKEN }}

      - name: Report result to Slack
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: "#protocol-internal"
          message: "Bump version to ${{ steps.bump-version.outputs.new_version }}-${{ inputs.NETWORK }}! Check for release in 1hr; cc <!subteam^S028FDV6CCV>"
