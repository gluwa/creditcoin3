---
# Run the actual relayer against Creditcoin, destination Anvil, live attestors and native proofs.
# Every companion repository is checked out explicitly so relayer/contract PRs exercise their
# candidate code when calling this workflow from another repository.
name: write-ability-e2e

# checkov:skip=CKV_GHA_7:Inputs select SHA-pinned E2E dependencies and allowlisted test scenarios.
"on":
  workflow_dispatch:
    inputs:
      creditcoin-ref:
        description: Full Creditcoin commit SHA (empty uses this workflow's commit)
        type: string
        default: ""
      relayer-repository:
        description: Repository containing the relayer candidate
        type: string
        default: gluwa/asc-message-relayer
      relayer-ref:
        description: Full relayer candidate commit SHA
        type: string
        default: 2682fddca7809a9bcbaaf0c7c38d45e0763b6cc2
      contracts-ref:
        description: Full compatible contracts commit SHA
        type: string
        default: 9e8a9e603d964b598b0d74bb8f4e5966ef75d17e
      scenarios:
        description: Comma-separated E2E scenarios
        type: string
        default: happy-path,durable-restart
  workflow_call:
    inputs:
      creditcoin-ref:
        description: Full Creditcoin commit SHA (required for cross-repository callers)
        type: string
        default: ""
      relayer-repository:
        type: string
        default: gluwa/asc-message-relayer
      relayer-ref:
        type: string
        default: 2682fddca7809a9bcbaaf0c7c38d45e0763b6cc2
      contracts-ref:
        type: string
        default: 9e8a9e603d964b598b0d74bb8f4e5966ef75d17e
      scenarios:
        type: string
        default: happy-path,durable-restart
    secrets:
      GLUWA_BOT_TOKEN:
        description: Read access to the private asc-contracts repository
        required: true
  pull_request:
    branches:
      [
        main,
        dev,
        asc-dev,
        usc-dev,
        usc-testnet,
        attestor_v2,
        writeability-off-usc-dev,
      ]
    paths:
      - "attestor/**"
      - "common/**"
      - "usc-messaging/**"
      - "pallets/supported-chains/**"
      - "pallets/attestation/**"
      - "precompiles/chain-info/**"
      - "primitives/supported-chains/**"
      - "runtime/**"
      - "node/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/write-ability-e2e.yml"
      - ".github/workflows/build-native.yml"
      - ".github/actions/install-foundry/**"

concurrency:
  # The caller has its own concurrency group. github.workflow is the caller's name even inside
  # a reusable workflow, so sharing the caller's group would cancel this run itself.
  group: cc3-fullstack-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      creditcoin-ref: ${{ steps.refs.outputs.creditcoin-ref }}
      relayer-repository: ${{ steps.refs.outputs.relayer-repository }}
      relayer-ref: ${{ steps.refs.outputs.relayer-ref }}
      contracts-ref: ${{ steps.refs.outputs.contracts-ref }}
      scenarios: ${{ steps.refs.outputs.scenarios }}
    steps:
      - name: Validate immutable sources and required contracts access
        id: refs
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CREDITCOIN_INPUT: ${{ inputs.creditcoin-ref }}
          CREDITCOIN_REF: ${{ inputs.creditcoin-ref || github.sha }}
          RELAYER_REPOSITORY: ${{ inputs.relayer-repository || 'gluwa/asc-message-relayer' }}
          RELAYER_REF: ${{ inputs.relayer-ref || '2682fddca7809a9bcbaaf0c7c38d45e0763b6cc2' }}
          CONTRACTS_REF: ${{ inputs.contracts-ref || '9e8a9e603d964b598b0d74bb8f4e5966ef75d17e' }}
          SCENARIOS: ${{ inputs.scenarios || 'happy-path,durable-restart' }}
          CONTRACTS_TOKEN: ${{ secrets.GLUWA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$CALLER_REPOSITORY" != gluwa/creditcoin3 && -z "$CREDITCOIN_INPUT" ]]; then
            echo "::error::Cross-repository callers must supply creditcoin-ref."
            exit 1
          fi
          for ref in "$CREDITCOIN_REF" "$RELAYER_REF" "$CONTRACTS_REF"; do
            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::All source refs must be full commit SHAs."
              exit 1
            fi
          done
          if [[ ! "$RELAYER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid relayer repository."
            exit 1
          fi
          IFS=',' read -ra cases <<< "$SCENARIOS"
          for scenario in "${cases[@]}"; do
            case "$scenario" in
              happy-path|durable-restart) ;;
              *) echo "::error::Unknown scenario: $scenario"; exit 1 ;;
            esac
          done
          if [[ -z "$CONTRACTS_TOKEN" ]]; then
            echo "::error::GLUWA_BOT_TOKEN is required to test real private asc-contracts. Run in a trusted context with contracts access; this gate cannot silently skip."
            exit 1
          fi
          {
            echo "creditcoin-ref=$CREDITCOIN_REF"
            echo "relayer-repository=$RELAYER_REPOSITORY"
            echo "relayer-ref=$RELAYER_REF"
            echo "contracts-ref=$CONTRACTS_REF"
            echo "scenarios=$SCENARIOS"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-native.yml
    with:
      repository: gluwa/creditcoin3
      ref: ${{ needs.prepare.outputs.creditcoin-ref }}
      build-options: "--release --features=fast-runtime"
      git-lfs-checkout: false
      version-string: write-ability-e2e
      cache-key-name: build-creditcoin-node
      runs-on: '["ubuntu-26.04"]'
      reuse-binaries: true
      workspace-opt-level: "1"
    secrets: inherit

  e2e:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    # Cover cold relayer/ABI builds plus the runner's bounded deployment and recovery waits,
    # leaving time for cleanup and evidence upload. The native build has its own 120m limit.
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      E2E_OUTPUT_DIR: ${{ github.workspace }}/e2e-output
      SCENARIOS: ${{ needs.prepare.outputs.scenarios }}
    steps:
      - name: Check out Creditcoin and the scenario runner
        uses: actions/checkout@v7
        with:
          repository: gluwa/creditcoin3
          ref: ${{ needs.prepare.outputs.creditcoin-ref }}

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: binary-for-write-ability-e2e
          path: target/release

      - name: Check out candidate relayer
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.relayer-repository }}
          ref: ${{ needs.prepare.outputs.relayer-ref }}
          path: asc-message-relayer

      - name: Check out compatible contracts
        uses: actions/checkout@v7
        with:
          repository: gluwa/asc-contracts
          ref: ${{ needs.prepare.outputs.contracts-ref }}
          path: asc-contracts
          token: ${{ secrets.GLUWA_BOT_TOKEN }}
          persist-credentials: false

      - name: Record tested source commits
        run: |
          mkdir -p "$E2E_OUTPUT_DIR"
          jq -n --arg creditcoin "$(git rev-parse HEAD)" \
            --arg relayer "$(git -C asc-message-relayer rev-parse HEAD)" \
            --arg contracts "$(git -C asc-contracts rev-parse HEAD)" \
            '{creditcoin: $creditcoin, relayer: $relayer, contracts: $contracts}' \
            > "$E2E_OUTPUT_DIR/sources.json"
          cat "$E2E_OUTPUT_DIR/sources.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the candidate relayer toolchain
        id: relayer-toolchain
        working-directory: asc-message-relayer
        run: |
          version=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust cache for the candidate relayer
        uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.relayer-toolchain.outputs.version }}
        with:
          workspaces: asc-message-relayer

      - name: Build candidate relayer
        working-directory: asc-message-relayer
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p message-relayer

      - name: Make native binaries executable
        run: chmod a+x target/release/creditcoin3-node target/release/attestor target/release/attestor_zombienet target/release/proof-gen-api-server

      - name: Install Foundry
        uses: ./.github/actions/install-foundry
        with:
          version: v1.5.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: usc-messaging/package-lock.json

      - name: Install scenario runner dependencies
        working-directory: usc-messaging
        run: npm ci --ignore-scripts

      - name: Compile contracts and enforce ABI compatibility
        run: |
          cd asc-contracts
          npm ci --ignore-scripts
          npx hardhat compile
          echo "ASC_CONTRACTS_DIR=$GITHUB_WORKSPACE/asc-contracts" >> "$GITHUB_ENV"
          echo "ABI_GATE_STRICT=1" >> "$GITHUB_ENV"

      - name: Check runner and ABI bindings
        env:
          ASC_CONTRACTS_DIR: ${{ github.workspace }}/asc-contracts
          ABI_GATE_STRICT: "1"
        run: |
          npm --prefix usc-messaging run e2e:typecheck
          npm --prefix usc-messaging run e2e:test
          cargo test --locked -p write-ability --test abi_surface -- --nocapture
          cd asc-message-relayer
          cargo test --locked -p write-ability --test abi_surface -- --nocapture

      - name: Exercise delivery, settlement and durable restart
        working-directory: usc-messaging
        env:
          RELAYER_BIN: ${{ github.workspace }}/asc-message-relayer/target/release/message-relayer
          RUST_LOG: info
        run: npm run e2e -- --scenario "$SCENARIOS" --output-dir "$E2E_OUTPUT_DIR"

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: write-ability-e2e-evidence
          path: |
            e2e-output/
            !e2e-output/state/creditcoin/**
            !e2e-output/state/proof-gen/**
          include-hidden-files: true
