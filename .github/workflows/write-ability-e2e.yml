---
# USC write-ability end-to-end: dApp -> Outbox -> attestors (gossip votes) -> relayer
# (2N/3+1 quorum) -> EOAValidator.validateVotes -> Inbox.deliverMessage -> destination dApp,
# then the proof-based acknowledgment round-trip: proof-gen serves a native USC delivery proof
# (block-prover precompile: merkle inclusion + continuity) for the attested destination block ->
# relayer submits it to AcknowledgmentValidator -> Outbox.acknowledgeMessage (acknowledged=true).
#
# Modeled on ci.yml's `integration-test-attestator-network`: it reuses the same self-hosted
# build pipeline (deploy-runner -> build-native.yml) to produce the release binaries, then runs
# the full cross-chain message flow on a fresh local stack and asserts the message is delivered
# on the destination chain.
#
# NOTE: relayer<->attestor peer discovery uses mDNS (the single-route relayer has no --boot-nodes
# flag). That works for processes co-located on one runner, mirroring the validated local run. If
# this proves flaky on the runner, add a --boot-nodes flag to the relayer and wire the zombienet
# attestor addresses in here.
name: write-ability-e2e

"on":
  workflow_dispatch:
  pull_request:
    branches: [main, usc-dev, usc-testnet, attestor_v2]
    paths:
      - "attestor/**"
      - "common/**"
      - "usc-messaging/**"
      - "pallets/supported-chains/**"
      - "precompiles/chain-info/**"
      - "primitives/supported-chains/**"
      - "runtime/**"
      - "node/src/chain_spec.rs"
      - ".github/workflows/write-ability-e2e.yml"
      - ".github/workflows/build-native.yml"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  deploy-runner-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - proxy: build-write-ability-e2e
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: ${{ matrix.proxy }}
    secrets: inherit

  build:
    needs:
      - deploy-runner-build
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=fast-runtime"
      git-lfs-checkout: false
      version-string: write-ability-e2e
      cache-key-name: build-creditcoin-node
      runs-on: "['self-hosted', 'workflow-${{ github.run_id }}', 'proxy-build-write-ability-e2e']"
    secrets: inherit

  rm-runner:
    needs:
      - build
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - proxy: build-write-ability-e2e
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: ${{ matrix.proxy }}
    secrets: inherit

  e2e:
    needs:
      - build
    runs-on: ubuntu-24.04
    env:
      LOGS: /var/tmp/write-ability-e2e
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binary-for-write-ability-e2e
          path: target/release

      # The relayer lives in its own repository (public) since the extraction — build it from
      # source here so the e2e still exercises attestor + relayer together. Pinned to a full commit
      # SHA (see the `ref:` below) so the e2e is reproducible; cross-repo protocol drift is caught by
      # the shared write-ability golden vectors on both sides. (Alternative once image publishing is
      # wired: docker cp the binary out of a SHA-tagged gluwa/usc-message-relayer image.)
      - name: Check out usc-message-relayer
        uses: actions/checkout@v6
        with:
          repository: gluwa/usc-message-relayer
          # Pin a full commit SHA (not a branch) so this creditcoin3 commit always builds against
          # the *same* relayer code — `ref: main` made the e2e non-reproducible (the same commit
          # could pass or fail as the relayer's default branch moved). Bump this deliberately when
          # a relayer change needs to be exercised here.
          ref: 9ffe2a29dfcaeccc6df4dc524d76c71955840cd4 # usc-message-relayer main @ #26 (funded-gas delivery + under-funding/timeout hardening)
          path: usc-message-relayer

      # Fee-integrated write-ability contracts. The plain-ethers deploy scripts read their compiled
      # artifacts from here (via $USC_CONTRACTS_DIR); pinned to a full SHA so the e2e is reproducible.
      - name: Check out usc-contracts (fee-integrated contracts)
        uses: actions/checkout@v6
        with:
          repository: gluwa/usc-contracts
          ref: 7f5b64a501a354019d78714cfb293d934a1527c3 # sync/contracts-dev-694d6cc — bump deliberately
          path: usc-contracts
          # usc-contracts is private; the default GITHUB_TOKEN is scoped to creditcoin3 only and
          # gets "Repository not found". Use the org bot PAT (same one build-native uses cross-repo).
          token: ${{ secrets.GLUWA_BOT_TOKEN }}

      - name: Rust cache (usc-message-relayer)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: usc-message-relayer

      - name: Build message-relayer
        working-directory: ./usc-message-relayer
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p message-relayer
          cp target/release/message-relayer ../target/release/message-relayer

      - name: Make binaries executable
        run: |
          mkdir -p "$LOGS"
          chmod a+x ./target/release/creditcoin3-node ./target/release/attestor* ./target/release/message-relayer ./target/release/proof-gen-api-server

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: usc-messaging/package-lock.json

      - name: Install usc-messaging deps
        working-directory: ./usc-messaging
        # The plain-ethers fee-stack scripts (deploy-*/publish-fee/claim-delivery) + quoter run via
        # tsx and need ethers / @polkadot/api / express from usc-messaging's own package.
        run: npm install

      - name: Build usc-contracts artifacts (fee stack)
        working-directory: ./usc-contracts
        # `npm install` (not `npm ci`): usc-contracts' committed lockfile can lag its package.json
        # at the pinned SHA (e.g. a missing @openzeppelin/contracts entry), which `npm ci` rejects.
        # We only need the compiled artifacts, so tolerate the drift and resolve on the fly.
        run: |
          npm install
          npx hardhat compile
          echo "USC_CONTRACTS_DIR=$GITHUB_WORKSPACE/usc-contracts" >> "$GITHUB_ENV"

      - name: Start anvil (destination chain)
        run: |
          ~/.foundry/bin/anvil --block-time 6 --chain-id 31337 --port 8545 >"$LOGS/anvil.log" 2>&1 &

      - name: Start creditcoin3-node (--dev)
        env:
          RUST_LOG: info
        run: |
          ./target/release/creditcoin3-node --dev --tmp >"$LOGS/cc3-node.log" 2>&1 &

      - name: Wait for chains
        run: |
          .github/wait-for-ethereum.sh 'http://127.0.0.1:8545'
          .github/wait-for-creditcoin.sh 'http://127.0.0.1:9944'

      - name: Deploy fee stack (dest + source incl. AcknowledgmentValidator) + register factory
        working-directory: ./usc-messaging
        # deploy-source-ethers.mts deploys the fee-integrated Outbox via the CREATE2 factory plus the
        # quoter, vaults, RelayerContract and the AcknowledgmentValidator (wired as the Outbox
        # validator); register-factory.mjs registers the factory in the CC runtime so the attestor's
        # chain-info precompile resolves it. Addresses land in /tmp/e2e-deploy.json.
        run: |
          npx tsx scripts/deploy-dest-ethers.mts
          npx tsx scripts/deploy-source-ethers.mts
          node scripts/register-factory.mjs

      - name: Write .env from deployed addresses
        working-directory: ./usc-messaging
        run: |
          J=/tmp/e2e-deploy.json
          {
            echo "DESTINATION_CHAIN_KEY=2"
            echo "DESTINATION_CHAIN_WS_URL=ws://localhost:8545"
            echo "DESTINATION_CHAIN_RPC_URL=http://localhost:8545"
            echo "DESTINATION_CHAIN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
            echo "CREDITCOIN_RPC_URL=http://localhost:9944"
            echo "CREDITCOIN_CHAIN_PRIVATE_KEY=0x8075991ce870b93a8870eca0c0f91913d12f47948ca0fd25b49c6fa7cdbeee8b"
            echo "VOTE_VALIDATOR_ADDR=$(jq -r .dest.voteValidator $J)"
            echo "INBOX_ADDR=$(jq -r .dest.inbox $J)"
            echo "OUTBOX_ADDR=$(jq -r .source.outbox $J)"
            echo "ACK_VALIDATOR_ADDR=$(jq -r .source.ackValidator $J)"
            echo "RELAYER_FEE_VAULT_ADDR=$(jq -r .source.relayerFeeVault $J)"
            echo "DAPP_CONTRACT_ADDR=$(jq -r .dest.dapp $J)"
          } > .env
          cat .env

      - name: Start quoter service (EIP-712 signed quotes)
        working-directory: ./usc-messaging
        run: |
          RC="$(jq -r .source.relayerContract /tmp/e2e-deploy.json)"
          QUOTER_PRIVATE_KEY=0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6 \
          QUOTER_PORT=3010 QUOTER_SOURCE_CHAIN_ID=42 QUOTER_RELAYER_CONTRACT="$RC" \
          QUOTER_CHAINS='[{"chainKey":2,"nativeUsd":"3000","gasPriceGwei":"1","coreFeeAttest":"1","ackGas":500000}]' \
          npx tsx src/quoter/index.ts >"$LOGS/quoter.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf localhost:3010/health >/dev/null && { echo "✅ quoter online"; exit 0; }
            sleep 1
          done
          echo "❌ quoter did not come online"; tail -20 "$LOGS/quoter.log"; exit 1

      - name: Launch attestor zombienet (discovers addresses, syncs EOAValidator set)
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          bash usc-messaging/scripts/launch-attestors.sh 3 >"$LOGS/zombienet.log" 2>&1 &
          echo "Waiting for attestors to resolve the Outbox and the validator set to sync…"
          for _ in $(seq 1 90); do
            if grep -q 'Attestor set ready' "$LOGS/zombienet.log"; then
              echo "✅ attestors ready"; grep -E 'zombie-[0-9] →|EOAValidator attestor set updated' "$LOGS/zombienet.log" || true
              exit 0
            fi
            if grep -qE 'Timed out|zombienet exited|❌' "$LOGS/zombienet.log"; then
              echo "❌ attestor launch failed:"; tail -40 "$LOGS/zombienet.log"; exit 1
            fi
            sleep 3
          done
          echo "❌ timed out waiting for attestors"; tail -60 "$LOGS/zombienet.log"; exit 1

      - name: Start proof-gen API server (native USC delivery proofs for the ack path)
        run: |
          # Legacy single-chain mode (default CHAIN_KEY=2) — consumes BlockAttested for the
          # destination (anvil, chain_key 2) that the attestors above produce, so it can build the
          # continuity proofs the AcknowledgmentValidator verifies on the source chain.
          CHAIN_KEY=2 ./target/release/proof-gen-api-server \
            --cc3-key //Alice \
            --cc3-rpc-url ws://localhost:9944 \
            --eth-rpc-url http://localhost:8545 \
            --bind-host 127.0.0.1 \
            --bind-port 3100 >"$LOGS/proof-gen.log" 2>&1 &
          for _ in $(seq 1 30); do
            grep -q 'Server listening on' "$LOGS/proof-gen.log" && { echo "✅ proof-gen online"; exit 0; }
            sleep 2
          done
          echo "❌ proof-gen did not come online"; tail -40 "$LOGS/proof-gen.log"; exit 1

      - name: Start relayer
        working-directory: ./usc-messaging
        env:
          RUST_LOG: info
        run: |
          set -a; source .env; set +a
          ATTESTOR_SET="$(cat scripts/.attestor-set)"
          ../target/release/message-relayer --single-route \
            --cc3-rpc-url ws://localhost:9944 \
            --creditcoin-eth-rpc-url http://localhost:9944 \
            --chain-key 2 \
            --cc3-chain-id 42 \
            --outbox-address "$OUTBOX_ADDR" \
            --destination-rpc-url http://localhost:8545 \
            --inbox-address "$INBOX_ADDR" \
            --signer-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --attestor-set "$ATTESTOR_SET" \
            --p2p-port 9300 \
            --relayer-fee-vault-address "$RELAYER_FEE_VAULT_ADDR" \
            --ack-proof-gen-url http://127.0.0.1:3100 \
            --ack-validator-address "$ACK_VALIDATOR_ADDR" \
            --ack-signer-key "$CREDITCOIN_CHAIN_PRIVATE_KEY" >"$LOGS/relayer.log" 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'libp2p subscriber online' "$LOGS/relayer.log" && { echo "✅ relayer online"; exit 0; }
            sleep 2
          done
          echo "❌ relayer did not come online"; tail -40 "$LOGS/relayer.log"; exit 1

      - name: Publish a fee'd cross-chain message (requiresAck)
        working-directory: ./usc-messaging
        run: |
          # Quotes from the live quoter, approves ATTEST, calls
          # RelayerContract.publishAndCollectRelayerFee, and records the messageId to
          # /tmp/e2e-published.json for the ack + claim assertions.
          timeout 180 npx tsx scripts/publish-fee.mts "ci-$GITHUB_RUN_ID" >"$LOGS/publish.log" 2>&1 || true
          tail -20 "$LOGS/publish.log" || true

      - name: Assert message was delivered on the destination chain
        working-directory: ./usc-messaging
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -a; source .env; set +a
          for _ in $(seq 1 40); do
            CNT="$(cast call "$DAPP_CONTRACT_ADDR" 'calls()(uint256)' --rpc-url http://127.0.0.1:8545 2>/dev/null || echo 0)"
            if [ "${CNT:-0}" != "0" ]; then
              echo "✅ message delivered — MockDestination.calls=$CNT"
              grep -E 'threshold reached|message delivered' "$LOGS/relayer.log" || true
              exit 0
            fi
            sleep 3
          done
          echo "❌ message was NOT delivered within timeout"
          echo "--- relayer log ---"; tail -60 "$LOGS/relayer.log" || true
          exit 1

      - name: Assert message was acknowledged on the source Outbox (proof-based ack round-trip)
        working-directory: ./usc-messaging
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -a; source .env; set +a
          MSG_ID="$(jq -r .messageId /tmp/e2e-published.json)"
          if [ -z "$MSG_ID" ] || [ "$MSG_ID" = "null" ]; then
            echo "❌ no messageId in /tmp/e2e-published.json"; tail -40 "$LOGS/publish.log" || true
            exit 1
          fi
          echo "Asserting acknowledgment for messageId=$MSG_ID"
          # Ack lands ~90s after delivery (waits for the destination block to be attested on CC3,
          # then proof-gen serves the proof and the relayer submits it to the AcknowledgmentValidator).
          for _ in $(seq 1 60); do
            ACK="$(cast call "$OUTBOX_ADDR" 'isAcknowledged(bytes32)(bool)' "$MSG_ID" \
              --rpc-url http://127.0.0.1:9944 2>/dev/null || echo false)"
            if [ "$ACK" = "true" ]; then
              echo "✅ message acknowledged — Outbox.isAcknowledged($MSG_ID)=true"
              grep -E 'acknowledg|submitAcknowledgment|✅' "$LOGS/relayer.log" | tail -10 || true
              exit 0
            fi
            sleep 3
          done
          echo "❌ message was NOT acknowledged within timeout"
          echo "--- relayer log ---"; tail -80 "$LOGS/relayer.log" || true
          echo "--- proof-gen log ---"; tail -60 "$LOGS/proof-gen.log" || true
          exit 1

      - name: Assert Level-2 claimDelivery relayer payout
        working-directory: ./usc-messaging
        run: |
          # Fetches the destination delivery proof from proof-gen, builds the BlockProverTypes
          # structs, calls RelayerFeeVault.claimDelivery from a gas-only claimant, and asserts the
          # ATTEST payout (relayFee+tip) + relaySettled == true.
          set -a; source .env; set +a
          timeout 240 npx tsx scripts/claim-delivery.mts

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: write-ability-e2e-logs
          path: |
            /var/tmp/write-ability-e2e/
            ./logs
          include-hidden-files: true

      - name: Stop background processes
        if: always()
        continue-on-error: true
        run: |
          killall -TERM message-relayer proof-gen-api-server attestor_zombienet attestor creditcoin3-node anvil || true
          sleep 5
          killall -KILL message-relayer proof-gen-api-server attestor_zombienet attestor creditcoin3-node anvil || true
