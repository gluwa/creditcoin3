---
name: Docker

"on":
  # Image builds are release artifacts, not a per-PR check: the node image alone is a ~27
  # minute Rust compile on a dedicated Linode runner, and nothing in a PR consumes the
  # result. So a PR builds images only when it asks for them:
  #   * it changes how the images are built (Dockerfile, compose, these workflows), the one
  #     class of change that can only be validated by building; or
  #   * it carries the `ci:docker` label (add the label to (re)build on demand — a labeled
  #     event re-runs this workflow).
  # Every push to a trunk branch builds once, so a deployable image artifact exists for the
  # merged commit (the devnet roll downloads it from here), and release.yml builds and
  # pushes the tagged images. Rust/toml changes on their own no longer trigger anything.
  pull_request:
    branches: [main, usc-testnet, usc-dev]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, usc-testnet, usc-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# DO-2336/DO-2338: any explicit narrower permissions declaration here (workflow-level
# or job-level, 2 scopes or 13) caused a hard startup_failure every time, confirmed
# live across several attempts, for reasons that weren't identified — reverted to the
# proven-working shorthand. docker/scout-action's PR comment instead uses a dedicated
# gluwa-bot PAT (secrets.GLUWA_BOT_PR) as its github-token, sidestepping the need for
# GITHUB_TOKEN's own permissions to be elevated at all.
permissions: read-all

jobs:
  # Decide whether this run builds at all (`build`) and whether the node image is part of it
  # (`node_image`). Trunk pushes and manual runs always build everything: a manual run has no
  # base ref to diff against, and a trunk build is the deploy artifact. A PR builds only on the
  # `ci:docker` label or when the files that define the images changed. The indexer and
  # stress-test images are built from their own external base images (subql-node-substrate,
  # deno) and never derive from the node image, so a change to one of their Dockerfiles builds
  # them without paying for the node image's Rust compile.
  detect-changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ github.event_name != 'pull_request' && 'true' || steps.decide.outputs.build }}
      node_image: ${{ github.event_name != 'pull_request' && 'true' || steps.decide.outputs.node_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            node_image:
              # The root Dockerfile only. cc3-indexer/Dockerfile and
              # scripts/stress-test/Dockerfile build their own images, not this one.
              - 'Dockerfile'
              # docker-compose.yaml runs `image: gluwa/creditcoin3`, which docker-test
              # exercises in its "Start validator via compose" step.
              - 'docker-compose.**'
              - '.github/workflows/build-docker.yml'
              - '.github/workflows/docker.yml'
            any_image:
              - '**Dockerfile**'
              - 'docker-compose.**'
              - '.github/workflows/build-docker.yml'
              - '.github/workflows/docker.yml'
      - name: Decide what this PR builds
        if: github.event_name == 'pull_request'
        id: decide
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:docker') }}
          ANY_IMAGE: ${{ steps.filter.outputs.any_image }}
          NODE_IMAGE: ${{ steps.filter.outputs.node_image }}
        run: |
          if [ "$LABELED" = "true" ]; then
            echo "INFO: ci:docker label present — building every image"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "node_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "INFO: image-defining files changed: any=$ANY_IMAGE node=$NODE_IMAGE"
            echo "build=$ANY_IMAGE" >> "$GITHUB_OUTPUT"
            echo "node_image=$NODE_IMAGE" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    needs:
      - detect-changes
      - deploy-runner-docker-build
    if: ${{ needs.detect-changes.outputs.build == 'true' }}
    uses: ./.github/workflows/build-docker.yml
    # DO-2336/DO-2338: explicit named pass-through, NOT `secrets: inherit` — this job
    # deliberately has no DOCKER_PUSH_USERNAME/PASSWORD (only release.yml, tag-triggered,
    # does real pushes); inherit would leak those in and make "Push docker images"
    # start firing on every ordinary PR/push build here. DOCKERHUB_SCOUT_* is a separate
    # read-only gluwabot token safe to expose to PR builds (which run untrusted PR
    # content) — it lets Scout authenticate without granting any push capability.
    secrets:
      GLUWA_BOT_PR: ${{ secrets.GLUWA_BOT_PR }}
      DOCKERHUB_SCOUT_USERNAME: ${{ secrets.DOCKERHUB_SCOUT_USERNAME }}
      DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
    with:
      build-options: "BUILD_ARGS="
      version-string: "latest"
      runs-on: "['self-hosted', 'workflow-${{ github.run_id }}', 'proxy-docker-build']"
      build-node-image: ${{ needs.detect-changes.outputs.node_image == 'true' }}

  docker-test:
    needs:
      - detect-changes
      - docker-build
    # Every assertion here runs against the node image; skip when it was not (re)built.
    if: ${{ needs.detect-changes.outputs.build == 'true' && needs.detect-changes.outputs.node_image == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Download locally built docker image
        uses: actions/download-artifact@v8
        with:
          name: locally-built-docker-image
          path: ${{ runner.temp }}/gluwa/

      - name: Load locally built docker image
        run: |
          docker load --input ${{ runner.temp }}/${{ github.repository }}.tar
          docker images

      - uses: actions/checkout@v7

      - name: Start a Devnet container from image
        run: |
          # see https://opensource.com/article/18/5/how-find-ip-address-linux
          IP_ADDRESS=$(curl https://ifconfig.me)
          echo "INFO: IP_ADDRESS=$IP_ADDRESS"

          docker run --rm --name creditcoin-validator -d -p 9944:9944 -p 30333:30333 ${{ github.repository }} \
              --dev --validator \
              --pruning archive \
              --node-key d182d503b7dd97e7c055f33438c7717145840fd66b2a055284ee8d768241a463 \
              --unsafe-rpc-external

      - name: Sanity test creditcoin-cli inside the container
        run: |
          docker exec creditcoin-validator which creditcoin
          docker exec creditcoin-validator creditcoin wizard --help
          docker exec creditcoin-validator creditcoin attestor --help

      - name: Sanity check for chainspecs inside the container
        run: |
          for f in chainspecs/*.json; do
              spec=$(basename "$f")
              docker exec creditcoin-validator  ls -l "/$spec"
          done

      - name: Sanity check other binaries inside the container
        run: |
          docker exec creditcoin-validator which attestor
          docker exec creditcoin-validator attestor --help

          docker exec creditcoin-validator which attestor_zombienet
          docker exec creditcoin-validator attestor_zombienet --help

          docker exec creditcoin-validator which query-cli
          docker exec creditcoin-validator query-cli --help

          docker exec creditcoin-validator which proof-gen-api-server
          docker exec creditcoin-validator proof-gen-api-server --help

      - name: Collect docker logs
        if: always()
        run: |
          docker logs creditcoin-validator >docker-creditcoin-validator.log 2>&1

      - name: Kill the container
        run: |
          sudo killall -9 creditcoin3-node
          sleep 10
          docker rm -f creditcoin-validator
          sleep 10

      - name: Start validator via compose
        run: |
          docker compose up -d

      - name: Sanity check for persistently mounted directory
        run: |
          sleep 60
          docker exec creditcoin-validator ls -ld /creditcoin-node/data
          docker exec creditcoin-validator ls -la /creditcoin-node/data

      - name: Collect compose logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose-validator.log

      - name: Kill the validator container
        run: |
          # note: killall will report failure if process had crashed
          sudo killall -9 creditcoin3-node

          # while downing a compose will not even when the underlying containers have crashed
          docker compose down

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: docker-*.log

  # The Linode runner is only worth deploying when something will be built on it.
  deploy-runner-docker-build:
    needs:
      - detect-changes
    if: ${{ needs.detect-changes.outputs.build == 'true' }}
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: "docker-build"
    secrets: inherit

  rm-gh-runner-docker-build:
    needs:
      - detect-changes
      - docker-build
    # `always()` so a failed build still releases its runner; the second clause keeps it from
    # trying to remove a runner that was never deployed.
    if: ${{ always() && needs.detect-changes.outputs.build == 'true' }}
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: "docker-build"
    secrets: inherit
