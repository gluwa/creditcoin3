---
name: rust

"on":
  pull_request:
    paths:
      - "**.rs"
      - "**.toml"
      - "**Cargo**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
  # PR caches are scoped to refs/pull/*/merge. Populate the base branch too so
  # a new PR can restore dependencies compiled by an earlier trusted run.
  push:
    branches: [usc-dev]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/.cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/rust.yml"
  # Refill evicted caches and account for updates to the hosted runner image.
  schedule:
    - cron: "20 1 * * 1-5"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

permissions: read-all

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"
  CACHE_WARM_ONLY: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}

jobs:
  cargo-audit:
    if: github.base_ref == 'usc-dev' || github.ref == 'refs/heads/usc-dev'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: tools-audit
          cache-targets: false

      - name: Install cargo audit
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --features=fix --locked

      - name: Run cargo audit
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo audit || true
          CC_MATCH=$(cargo audit --color never | grep -E "^.── creditcoin3-node" || true)

          # fail for anything which is a 1st level dependency of Creditcoin
          if [ -n "$CC_MATCH" ]; then
              echo "FAIL: Direct dependencies of Creditcoin found in audit report"
              echo "INFO: Inspect the output above for more information"
              exit 1
          else
              echo "INFO: No direct dependencies of Creditcoin found in audit report"
              exit 0
          fi

  cargo-fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: tools-fmt
          cache-targets: false

      - name: Check formatting
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: gluwa/cargo@dev
        with:
          command: fmt
          args: -- --check

      - name: Check TOML formatting
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo install taplo-cli --locked
          taplo format --check

  cargo-check:
    runs-on: ubuntu-26.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: rust-check

      - name: Check featalign
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail

          cargo install --locked cargo-featalign@0.7.0

          # produces a human readable output
          cargo featalign runtime --features std,runtime-benchmarks,fast-runtime,devnet --workspace-only --default-std --depth -1 --mode check | jq

      - name: Check Build
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          SKIP_WASM_BUILD=1 cargo check --release

      - name: Check Build for Benchmarking
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          SKIP_WASM_BUILD=1 cargo check --features=runtime-benchmarks --release

  cargo-clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
          components: clippy, rust-src

      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: rust-clippy

      - name: Print clippy's version
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: gluwa/cargo@dev
        with:
          command: clippy
          args: --version

      - name: Run Clippy
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: gluwa/cargo@dev
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings -A clippy::manual_inspect

  cargo-machete:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-machete@0.9.1

      - name: Execute cargo machete
        run: cargo machete

  cargo-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GLUWA_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: llvm-tools-preview, rust-src
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: rust-test-coverage

      - name: Install cargo-llvm-cov
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov@0.6.24

      - name: Run tests
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo llvm-cov \
              --release \
              --workspace --html --show-missing-lines --hide-instantiations \
              --ignore-filename-regex "(benchmarking.rs|mock.rs|tests(.*).rs|weights.rs)"

      - name: Run simulations
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        id: simulation
        env:
          PROPTEST_CASES: 10000
        run: |
          cargo test \
            --release \
            --features simulation \
            -p stream_attestation \
            simulate

      - name: Commit regression files
        uses: EndBug/add-and-commit@v10
        if: always() && env.CACHE_WARM_ONLY != 'true'
        with:
          push: true
          add: common/streams/attestation/proptest-regressions/simulation/mod.txt
          author_name: gluwa-bot
          author_email: creditcoin@gluwa.com
          message: "test(simulation): found new bug"
          github_token: ${{ secrets.GLUWA_BOT_TOKEN }}

      - name: Upload coverage report as artifact
        if: env.CACHE_WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
