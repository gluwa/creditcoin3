---
name: rust

"on":
  pull_request:
    paths:
      - "**.rs"
      - "**.toml"
      - "**Cargo**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

# Ubuntu 26.04 ships GCC 15, whose libstdc++ no longer transitively includes
# <cstdint>. The bundled RocksDB 8.1.1 headers (librocksdb-sys 0.11.0+8.1.1)
# use uint64_t without including it, so force-include cstdint when compiling C/C++.
env:
  CXXFLAGS: "-include cstdint"

jobs:
  cargo-audit:
    if: github.base_ref == 'usc-dev'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-creditcoin-node
          save-if: false

      - name: Install cargo audit
        run: |
          cargo install cargo-audit --features=fix --locked

      - name: Run cargo audit
        run: |
          cargo audit || true
          CC_MATCH=$(cargo audit --color never | grep -E "^.── creditcoin3-node" || true)

          # fail for anything which is a 1st level dependency of Creditcoin
          if [ -n "$CC_MATCH" ]; then
              echo "FAIL: Direct dependencies of Creditcoin found in audit report"
              echo "INFO: Inspect the output above for more information"
              exit 1
          else
              echo "INFO: No direct dependencies of Creditcoin found in audit report"
              exit 0
          fi

  cargo-fmt:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-creditcoin-node
          save-if: false

      - name: Check formatting
        uses: gluwa/cargo@dev
        with:
          command: fmt
          args: -- --check

      - name: Check TOML formatting
        run: |
          cargo install taplo-cli --locked
          taplo format --check

  cargo-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check

      - name: Check featalign
        run: |
          set -o pipefail

          cargo install --locked cargo-featalign@0.7.0

          # produces a human readable output
          cargo featalign runtime --features std,runtime-benchmarks,fast-runtime,devnet --workspace-only --default-std --depth -1 --mode check | jq

      # This is the only job that type-checks the crate graph with default features,
      # i.e. with runtime-benchmarks OFF. cargo-clippy runs --all-features, which turns
      # runtime-benchmarks ON and therefore never compiles the
      # #[cfg(not(feature = "runtime-benchmarks"))] blocks in runtime/src/lib.rs,
      # node/src/client.rs and node/src/command.rs. Do not fold this into clippy.
      - name: Check Build
        run: |
          SKIP_WASM_BUILD=1 cargo check --release

      # The former "Check Build for Benchmarking" step (cargo check
      # --features=runtime-benchmarks) was removed: cargo-clippy's
      # --all-targets --all-features is a strict superset of it, so it only re-paid for
      # a full compile of the same configuration.

  cargo-clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32v1-none
          components: clippy, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-clippy

      - name: Print clippy's version
        uses: gluwa/cargo@dev
        with:
          command: clippy
          args: --version

      # Nothing consumes the runtime wasm blob that substrate-wasm-builder would produce
      # here, and building it means a nested wasm32 compile of the whole runtime.
      - name: Run Clippy
        uses: gluwa/cargo@dev
        env:
          SKIP_WASM_BUILD: 1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings -A clippy::manual_inspect

  cargo-machete:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-creditcoin-node
          save-if: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-machete@0.9.1

      - name: Execute cargo machete
        run: cargo machete

  # Runs the test suite only. Coverage instrumentation and the long proptest soak moved
  # to rust-coverage.yml (nightly + workflow_dispatch): cargo llvm-cov injects
  # -C instrument-coverage into RUSTFLAGS, which changes every dependency's fingerprint
  # and meant a fourth from-cold compile of the whole graph on every PR. Nothing gated on
  # the coverage output; it was only uploaded as an HTML artifact for manual inspection.
  cargo-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: rust-src
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-nextest@0.9.78

      # nextest runs each test binary as its own process and parallelises across them.
      # SKIP_WASM_BUILD is safe here: WASM_BINARY is referenced only by the chainspec
      # builders in node/src/chain_spec.rs, which no test in the workspace calls.
      - name: Run tests
        env:
          SKIP_WASM_BUILD: 1
        run: |
          cargo nextest run --release --workspace

      # NOTE: doctests are deliberately not run here, which matches the behaviour this
      # job had before. cargo-llvm-cov only runs doctests when passed --doctests, which
      # needs nightly, and rust-toolchain.toml pins stable 1.88.0 -- so the ~50 doctest
      # blocks in common/utils, common/continuity and proof-gen-api-server were never
      # executed in CI. Adding `cargo test --doc` is worth doing, but it is a new gate
      # that may surface pre-existing failures, so it belongs in its own change rather
      # than hiding inside a CI speed-up.

      # A short proptest run keeps the attestation-stream invariants exercised per PR.
      # The 10000-case soak, and the auto-commit of any regression it finds, run in
      # rust-coverage.yml instead.
      - name: Run simulations
        id: simulation
        env:
          PROPTEST_CASES: 256
          SKIP_WASM_BUILD: 1
        run: |
          cargo test \
            --release \
            --features simulation \
            -p stream_attestation \
            simulate
