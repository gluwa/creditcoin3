---
name: cache-warm

# Populates the `build-creditcoin-node` Rust dependency cache on the default branch.
#
# Why this exists: a cache saved during a PR run is stored under refs/pull/<n>/merge,
# and GitHub will not let another PR restore it. Only caches on the default branch are
# readable by every PR. Every workflow in this repo that builds Rust was triggered by
# pull_request alone, so nothing ever wrote a cache a *fresh* PR could use, and each new
# PR compiled the whole dependency graph from cold. Re-running one PR looked fast while
# everyone else still paid full price.
#
# rust.yml carries its own `push` trigger for the rust-check / rust-clippy / rust-test
# keys. This workflow covers the separate key used by build-native.yml callers, all of
# which now run on self-hosted Linode VMs.
#
# IMPORTANT, on why this calls build-native.yml instead of running cargo directly:
# Swatinem/rust-cache mixes the Rust environment into the cache key, including env vars
# beginning with CXX. build-native.yml sets no CXXFLAGS while rust.yml sets
# `CXXFLAGS: -include cstdint`, so the two compute *different* keys even when both pass
# the same `shared-key`. Warming therefore has to reproduce the consumer's environment
# exactly, and the only reliable way to do that is to invoke the very same reusable
# workflow. Do not reimplement the build here.
"on":
  # Only manifest changes. The cache key is derived from the Cargo manifests and the
  # toolchain, and the cache holds dependencies rather than workspace crates, so an
  # ordinary .rs change leaves the existing key valid and the warmed entry still
  # applies. Warming on every push would re-pay a full build to refresh nothing.
  push:
    branches: [usc-dev]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-native.yml"
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/deploy-runner.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # Every remaining build-native.yml caller runs on a Linode VM: ci.yml's
  # build-creditcoin-node-for-testing-ci and rebuild-new-metadata, proof-gen-api-server,
  # benchmarks, both chainspec builds, runtime-upgrade and release. build-native.yml keys the
  # self-hosted family separately from hosted runners because a `target/` built under a
  # different Cargo home fingerprints as stale, so this is the producer that namespace needs.
  # Without it every fresh PR builds it cold.
  #
  # There used to be a second, hosted warmer here for the two compatibility builds. Those now
  # consume ci.yml's artifact instead of building anything, leaving no hosted caller of
  # build-native.yml at all, so it was removed rather than left warming a namespace nobody
  # reads.
  #
  # It costs one VM per manifest change on usc-dev, not per PR.
  deploy-runner:
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: cache-warm
    secrets: inherit

  warm-build-creditcoin-node-linode:
    needs: deploy-runner
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=fast-runtime"
      git-lfs-checkout: false
      version-string: cache-warm-linode
      cache-key-name: build-creditcoin-node
      runs-on: "['self-hosted', 'workflow-${{ github.run_id }}', 'proxy-cache-warm']"
      # Nothing consumes the output; this run exists only for its cache entry.
      upload-artifacts: false
    secrets: inherit

  # always() so a failed or cancelled build still releases the VM.
  remove-runner:
    needs: [deploy-runner, warm-build-creditcoin-node-linode]
    if: ${{ always() }}
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: cache-warm
    secrets: inherit
