---
name: cache-warm

# Populates the `build-creditcoin-node` and `build-release` Rust dependency caches on the
# default branch.
#
# Why this exists: a cache saved during a PR run is stored under refs/pull/<n>/merge,
# and GitHub will not let another PR restore it. Only caches on the default branch are
# readable by every PR. Every workflow in this repo that builds Rust was triggered by
# pull_request alone, so nothing ever wrote a cache a *fresh* PR could use, and each new
# PR compiled the whole dependency graph from cold. Re-running one PR looked fast while
# everyone else still paid full price.
#
# rust.yml carries its own `push` trigger for the rust-check / rust-clippy / rust-test
# keys. This workflow covers the separate key used by build-native.yml callers.
#
# IMPORTANT, on why this calls build-native.yml instead of running cargo directly:
# Swatinem/rust-cache mixes the Rust environment (rustc, CXX* env vars) into the cache
# key, so warming has to reproduce the consumer's environment exactly. Invoke the same
# reusable workflow; do not reimplement the build here.
"on":
  # Only manifest changes. The cache key is derived from the Cargo manifests and the
  # toolchain, and the cache holds dependencies rather than workspace crates, so an
  # ordinary .rs change leaves the existing key valid and the warmed entry still
  # applies. Warming on every push would re-pay a full build to refresh nothing.
  push:
    branches: [usc-dev, dev]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-native.yml"
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/deploy-runner.yml"
  # Hosted runners mix the image's preinstalled Rust into the cache key, so an image bump
  # invalidates the entry without any manifest change. A daily run re-warms it; scheduled
  # runs only fire on the default branch.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  # Let a running warm finish and save; only the newest waiting run follows it (see
  # build-cache.yml).
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

permissions: read-all

jobs:
  # Warms the hosted-runner family used by ci.yml, chainspec and proof-gen-api-server.
  warm-build-creditcoin-node:
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=fast-runtime"
      workspace-opt-level: "1"
      git-lfs-checkout: false
      version-string: cache-warm
      cache-key-name: build-creditcoin-node
      runs-on: "['ubuntu-26.04']"
      # Nothing consumes the output; this run exists only for its cache entry.
      upload-artifacts: false
    secrets: inherit

  # Warms the release configuration for release.yml. A tag build can restore caches from
  # the default branch only, and the fast-runtime entry above shares little with a
  # metadata-hash build, so without this every release compiled from cold. Testnet and
  # mainnet tags build exactly these features; devnet tags add `devnet` on top and still
  # reuse the dependencies.
  warm-build-release:
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features metadata-hash"
      git-lfs-checkout: false
      version-string: cache-warm-release
      cache-key-name: build-release
      runs-on: "['ubuntu-26.04']"
      upload-artifacts: false
      # Like the Rust cache, a subxt binary cached by a tag is readable by that tag alone,
      # so the default-branch entry releases restore has to come from here.
      build-subxt: true
    secrets: inherit

  # build-native.yml keys runner families separately (see "Identify runner family"), and
  # benchmarks and runtime-upgrade still build on Linode. This
  # leg keeps their self-hosted family warm. It costs one VM per manifest change or daily
  # run, not per PR.
  deploy-runner:
    uses: ./.github/workflows/deploy-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      LINODE_REGION: "nl-ams"
      LINODE_VM_SIZE: "g6-standard-6"
      proxy: cache-warm
    secrets: inherit

  warm-build-creditcoin-node-linode:
    needs: deploy-runner
    uses: ./.github/workflows/build-native.yml
    with:
      build-options: "--release --features=fast-runtime"
      workspace-opt-level: "1"
      git-lfs-checkout: false
      version-string: cache-warm-linode
      cache-key-name: build-creditcoin-node
      runs-on: "['self-hosted', 'workflow-${{ github.run_id }}', 'proxy-cache-warm']"
      upload-artifacts: false
    secrets: inherit

  # always() so a failed or cancelled build still releases the VM.
  remove-runner:
    needs: [deploy-runner, warm-build-creditcoin-node-linode]
    if: ${{ always() }}
    uses: ./.github/workflows/remove-runner.yml
    with:
      RUNNER_VM_NAME: "${{ github.event.repository.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
      proxy: cache-warm
    secrets: inherit

  # This workflow is the only producer of the default-branch cache entry PRs restore
  # from; a PR-scoped cache is not readable by other PRs. When it fails, every PR
  # builds cold and still goes green, so nothing else surfaces it.
  report-cache-producer-failure:
    needs:
      - warm-build-creditcoin-node
      - warm-build-release
      - deploy-runner
      - warm-build-creditcoin-node-linode
    if: ${{ failure() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report result to Slack
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          channel: "#protocol-internal"
          message: |-
            Native build cache warmer failed on `${{ github.ref_name }}`. PRs that build
            the node (ci.yml, proof-gen-api-server, chainspec, benchmarks) and releases
            will compile from cold until this is green again.
            warm-build (hosted): ${{ needs.warm-build-creditcoin-node.result }} |
            warm-build (release): ${{ needs.warm-build-release.result }} |
            deploy-runner: ${{ needs.deploy-runner.result }} |
            warm-build (Linode): ${{ needs.warm-build-creditcoin-node-linode.result }}
            Once the cause is fixed, re-run to repopulate the cache:
            `gh workflow run cache-warm.yml --ref ${{ github.ref_name }}`
            cc <!subteam^S028FDV6CCV>
