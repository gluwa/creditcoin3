---
attestor:
  # Local attestors name
  #   used for display and debug purposes.
  #
  name: "Deep Thought"

  # Source chain to attest to
  #   2: Ethereum Mainnet
  #   3: Ethereum Sepolia
  #
  chain_key: 2

  # Optional: Secret key used to sign attestation votes
  #   If no key is provided a random mnemonic will be used instead.
  #
  # secret: "test test test test test test test test test test test junk"

  # Optional: P2P listening address for libp2p networking
  #   If not specified, a random OS-assigned ipv4 address will be used. Use this
  #   to set a fixed dns address for Kubernetes LoadBalancer services.
  #
  # public_addr: attestor.dev

  # Optional: Path to the logs folder
  #   If not specified, defaults to ./logs.
  #
  # logs: ./logs

api:
  # Optional: API endpoints port
  #   If not specified, defaults to 9100.
  #
  # port: 9100

p2p:
  # Optional: Boot nodes for peer discovery
  #   Used to establish a map of available peers
  #
  # boot_nodes: []

  # Optional: Fixed P2P port for libp2p networking
  #   If not specified, defaults to 9000.
  #
  # port: 9000

eth:
  # Eth RPC url
  #   Used to pull source chain data and generate continuity proofs. Attestors
  #   are advised to run their own RPC server. The node must serve
  #   `eth_getBlockReceipts` (op-geth and geth do; some public gateways don't).
  #
  url: "ws://localhost:8545"

  # Optional: Source chain family
  #   ethereum: L1 and L1-shaped chains (Sepolia, Anvil, Polygon PoS)
  #   op-stack: OP-Stack rollups such as Base / OP Mainnet, whose blocks carry
  #             0x7e deposit transactions
  #   If omitted, defaults to ethereum for every chain id.
  #   Set op-stack explicitly for all OP-Stack chains, including Base and OP Mainnet.
  #
  # chain_family: op-stack

cc3:
  # CC3 RPC url
  #   Used to listen to CC3 events and storage changes. Attestors are advised to
  #   run their own RPC server.
  #
  url: "ws://localhost:9944"

attestation:
  # Optional: Initial height from which new attestations are produced
  #   If no starting height is specified, attestations will be generated from
  #   that source chain's configured genesis block number instead.
  #
  # start_height: 0

  # Optional: Source chain block interval at which new attestations are produced
  #   By default this value is fetched from on-chain storage. This options
  #   overrides it.
  #
  # interval: 10

write_ability:
  # USC cross-chain message attestation. When enabled, the attestor watches the
  # Creditcoin L1 Outbox for its chain_key and gossips ECDSA message votes on the
  # existing p2p swarm (topic {chain_key}/message-votes/v1). It never relays.
  #
  # The Creditcoin L1 EVM RPC used to watch the Outbox is derived from the `cc3:`
  # url above, and the Outbox is resolved entirely on-chain from chain_key
  # (chain-info precompile -> OutboxDiscovery -> defaultOutbox). If no discovery
  # registry/default Outbox is registered for this chain_key, write-ability stays
  # disabled for the run (the rest of the attestor keeps running normally).
  #
  # `enabled` is the operator's opt-in; the on-chain WriteAbilityConfigs entry for
  # this chain_key is governance's switch. When an entry exists it is authoritative:
  # message_attestation_enabled == false keeps the task off regardless of this flag,
  # and its bytes32 write-ability chain key overrides the locally derived one. No
  # entry (or a failed read) falls back to this local config. Read at startup;
  # on-chain changes are picked up on restart.
  #
  # Off by default: enabling it requires the destination contracts below.
  # usc-messaging/scripts/launch-attestors.sh turns it on for local runs.
  enabled: false

  # Destination-chain EOAValidator address. Required when enabled. The attestor
  # reads the authorized message-vote signer set and quorum threshold from
  # `EOAValidator.attestors()` / `threshold()` on the destination chain (the
  # chain this attestor set attests, i.e. the `eth` url), the same on-chain
  # source of truth the Inbox uses, and hot-reloads them while running.
  #
  # validator_address: "0x..."
  #
  # Destination Inbox address. Required when enabled: message votes are EIP-712
  # signed over (destination chainId, EOAValidator) for this Inbox, and the
  # attestor checks on-chain that the Inbox hands its votes to that validator
  # before signing anything.
  #
  # inbox_address: "0x..."

  # Legacy setting (accepted for compatibility, ignored for message signing).
  # Signing always requires the source finalized head, including during RPC/finality outages.
  #
  # block_confirmation_depth: 3

  # Base directory for durable write-ability cursors and pending messages, so a restart
  # resumes without skipping work published while down.
  #
  # Set here because the default is `/data` (the persistent volume the attestor
  # StatefulSet mounts in k8s), which cannot be created off-cluster: an unprivileged
  # local process gets "Read-only file system" at the filesystem root, and the boot
  # deliberately fails loudly when the state dir is not writable. In production leave
  # this unset so it uses the mounted volume.
  #
  # Multi-attestor local runs may share this base: each public signing account gets a
  # `write-ability-<account-hex>/` subdirectory. A lock per account and chain rejects a
  # duplicate process. Keep the whole base directory on restart.
  # On upgrade, legacy root-level state is preserved and copied into each account's
  # directory. Its cursor cannot prove this signer's coverage, so migration replays from
  # start_block (or genesis). Set a safe activation floor before upgrading.
  state_dir: ".attestor-state"

  # Anti-abuse bounds.
  #
  # max_tracked_messages: 10000
  # vote_ttl_secs: 3600
