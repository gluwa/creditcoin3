[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "cc-client"
publish.workspace = true
repository.workspace = true
version.workspace = true

[lints.clippy]
large_enum_variant = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
no_effect_underscore_binding = "allow"
pedantic = "warn"
redundant_slicing = "allow"
too_many_arguments = "allow"

[dependencies]
anyhow = "1.0"
arc-swap = { workspace = true }

# Substrate
subxt = { workspace = true, features = ["jsonrpsee"] }
subxt-signer = { workspace = true }

# Creditcoin deps
attestor-primitives = { workspace = true }
supported-chains-primitives = { workspace = true }
user = { workspace = true }

# workspace deps
serde = { workspace = true }
sp-core = { workspace = true, default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "signal",
    "sync",
    "time",
] }
tracing = { workspace = true }
usc-abi-encoding = { workspace = true, optional = true }

# `ws-fixture` only: an in-process fake Creditcoin WebSocket node for liveness tests.
futures = { workspace = true, optional = true }
hex = { workspace = true, features = ["alloc"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = ["std"]
# Disposable loopback Creditcoin node (`cc_client::ws_fixture`) for tests in this workspace.
# Never enable in a production build.
std = [
    "sp-core/std",
    "attestor-primitives/std",
    "supported-chains-primitives/std",
    "usc-abi-encoding",
]
ws-fixture = [
    "dep:futures",
    "dep:hex",
    "dep:serde_json",
    "dep:tokio-tungstenite",
    "tokio/net",
]
